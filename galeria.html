<script>
const H = document.documentElement;
H.setAttribute('data-theme', localStorage.getItem('ge-theme') === 'dark' ? 'dark' : 'light');
document.getElementById('theme-toggle')?.addEventListener('click', () => {
  const d = H.getAttribute('data-theme') === 'dark';
  H.setAttribute('data-theme', d ? 'light' : 'dark');
  localStorage.setItem('ge-theme', d ? 'light' : 'dark');
});
const gl = localStorage.getItem('ge-lang') || 'pl';
document.querySelectorAll('.lang-btn').forEach(b => {
  b.classList.toggle('active', b.dataset.lang === gl);
  b.addEventListener('click', () => { document.querySelectorAll('.lang-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); localStorage.setItem('ge-lang', b.dataset.lang); });
});

/* Gallery drag scroll */
const track = document.getElementById('galleryTrack');
const thumb = document.getElementById('galleryThumb');
let drag = false, startX = 0, scrollLeft = 0;
track.addEventListener('mousedown', e => { drag=true; startX=e.pageX; scrollLeft=track.scrollLeft; track.classList.add('dragging'); });
document.addEventListener('mouseup', () => { drag=false; track.classList.remove('dragging'); });
track.addEventListener('mousemove', e => { if(!drag) return; e.preventDefault(); track.scrollLeft = scrollLeft-(e.pageX-startX)*1.5; });
track.addEventListener('touchstart', e => { startX=e.touches[0].pageX; scrollLeft=track.scrollLeft; }, {passive:true});
track.addEventListener('touchmove', e => { track.scrollLeft = scrollLeft-(e.touches[0].pageX-startX); }, {passive:true});
const updateThumb = () => {
  const bar = thumb.parentElement;
  const ratio = track.scrollLeft / Math.max(1, track.scrollWidth - track.clientWidth);
  const tw = Math.max(40, bar.offsetWidth * track.clientWidth / track.scrollWidth);
  thumb.style.width = tw+'px'; thumb.style.left = (ratio*(bar.offsetWidth-tw))+'px';
};
track.addEventListener('scroll', updateThumb, {passive:true});
setTimeout(updateThumb, 200);

/* Lightbox */
const items = Array.from(track.querySelectorAll('img'));
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
let cur = 0;
const openLb = i => { cur=i; lbImg.src=items[i].src; lbImg.alt=items[i].alt; lightbox.classList.add('open'); lightbox.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; };
const closeLb = () => { lightbox.classList.remove('open'); lightbox.setAttribute('aria-hidden','true'); document.body.style.overflow=''; };
const nav = dir => { cur=(cur+dir+items.length)%items.length; lbImg.style.opacity='0'; setTimeout(()=>{ lbImg.src=items[cur].src; lbImg.alt=items[cur].alt; lbImg.style.opacity='1'; },110); };
items.forEach((img,i) => { img.style.pointerEvents='auto'; img.style.cursor='pointer'; img.addEventListener('click', ()=>{ if(!drag) openLb(i); }); });
document.querySelector('.lightbox__close').addEventListener('click', closeLb);
document.querySelector('.lightbox__prev').addEventListener('click', ()=>nav(-1));
document.querySelector('.lightbox__next').addEventListener('click', ()=>nav(1));
lightbox.addEventListener('click', e=>{ if(e.target===lightbox) closeLb(); });
document.addEventListener('keydown', e=>{ if(!lightbox.classList.contains('open')) return; if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') nav(-1); if(e.key==='ArrowRight') nav(1); });
</script>
